name: Build CALL-VARS Audiovisual (Qt)

on:
  # Runs every day at 06:00 UTC (01:00 EST).
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
    paths:
      - 'audiovisual/**'
      - '.github/workflows/call-vars-qt.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'audiovisual/**'
      - '.github/workflows/call-vars-qt.yml'

permissions:
  contents: read

jobs:
  build-qt:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt 6.8 (MSVC 2022, Multimedia + WebSockets)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        dir: 'C:\Qt'
        modules: 'qtmultimedia qtwebsockets'

    - name: Configure (CMake)
      run: cmake -S audiovisual -B build -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2019_64"

    - name: Build (Release)
      run: cmake --build build --config Release

    - name: Check the executable was built
      run: |
        $exe = "build/Release/CallVars.exe"
        if (-not (Test-Path $exe)) {
          Write-Error "Executable not found at $exe"
          Get-ChildItem -Recurse build/ | Select-Object FullName
          exit 1
        }
        Write-Host "Build passed: CallVars.exe exists"
