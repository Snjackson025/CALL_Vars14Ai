name: Build CALL-VARS Audiovisual (Qt)

on:
  # Runs every day at 06:00 UTC (01:00 EST).
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
    paths:
      - 'audiovisual/**'
      - '.github/workflows/call-vars-qt.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'audiovisual/**'
      - '.github/workflows/call-vars-qt.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-qt:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # Install Qt directly with aqt (the install-qt-action helper failed to
    # find the 6.8.3 packages). Qt 6.8.3 has no MSVC2019 binaries, so use
    # the MSVC2022 arch.
    - name: Install Qt 6.8.3 (MSVC 2022, Multimedia + WebSockets)
      run: |
        python -m pip install --upgrade aqtinstall
        python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir C:\Qt --modules qtmultimedia qtwebsockets

    - name: Configure (CMake)
      run: cmake -S audiovisual -B build -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64"

    - name: Build (Release)
      run: cmake --build build --config Release

    - name: Check the executable was built
      run: |
        $exe = "build/Release/CallVars.exe"
        if (-not (Test-Path $exe)) {
          Write-Error "Executable not found at $exe"
          Get-ChildItem -Recurse build/ | Select-Object FullName
          exit 1
        }
        Write-Host "Build passed: CallVars.exe exists"

    # Gather the Qt DLLs and plugins the exe needs so it runs on a
    # Windows machine without Qt installed.
    - name: Collect Qt runtime (windeployqt)
      run: C:\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe --release --compiler-runtime --no-translations build\Release\CallVars.exe

    - name: Upload CallVars app
      uses: actions/upload-artifact@v4
      with:
        name: CallVars-Windows
        path: build/Release/
